# ==========================================
# Nginx 伪静态规则（宝塔面板 → 网站 → 伪静态）
# ==========================================
# 把下面内容粘贴到宝塔面板对应网站的「伪静态」配置框中，保存即可。

location / {
    try_files $uri $uri/ /index.php?$query_string;
}

# 如果需要禁止直接访问 includes 和 templates 目录（安全加固）
location ~ ^/(includes|templates|database)/ {
    deny all;
    return 403;
}
